name: Two Places — job 1 worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incident-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the job skill
        run: |
          curl --fail --silent --show-error --location \
            'https://hq.mega.dev/media/two-places/incident-lookup-03b5d3a7.zip' \
            --output "$RUNNER_TEMP/incident-lookup.zip"
          unzip -oq "$RUNNER_TEMP/incident-lookup.zip" -d "$RUNNER_TEMP/incident-lookup"
          test -s "$RUNNER_TEMP/incident-lookup/incident-lookup/SKILL.md"
          grep -q 'scope: "ops/live"' "$RUNNER_TEMP/incident-lookup/incident-lookup/SKILL.md"
      - name: Run the incident-lookup worker
        env:
          MEGA_JOB_1_MCP_URL: ${{ secrets.MEGA_JOB_1_MCP_URL }}
        run: node .github/scripts/two-places-job1.mjs
